name: Update README

# README.md is generated from README.tpl.md -- edit the template, not the
# output. This runs daily, and on any push that changes how it renders.
on:
  schedule:
    # 03:17 UTC. Off the hour, because everyone schedules on the hour and
    # GitHub delays crons under load.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.tpl.md
      - scripts/render_readme.py
      - .github/workflows/readme.yml

# Deny by default; each job below declares only what it needs.
permissions: {}

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  # Runs the renderer, which handles README_TOKEN. This job can only read the
  # repository, and the checkout does not keep a write-capable credential.
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Render README
        env:
          # README_TOKEN is optional: a classic PAT with read:user also counts
          # private contributions. Without it the default token is used, which
          # sees public activity only.
          GITHUB_TOKEN: ${{ secrets.README_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: python scripts/render_readme.py

      - name: Upload rendered README
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-readme
          path: README.md
          if-no-files-found: error
          retention-days: 1

  # Commits the rendered file. This job holds the write permission but never
  # sees README_TOKEN and runs no repository code.
  commit:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Credentials are kept on purpose: the push below needs them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download rendered README
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-readme
          path: ${{ runner.temp }}/rendered

      - name: Commit if the numbers moved
        env:
          RENDERED: ${{ runner.temp }}/rendered/README.md
        run: |
          cp "$RENDERED" README.md
          if git diff --quiet -- README.md; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh README stats"
          # A commit landing on main between checkout and push gets our push
          # rejected. Rebase onto whatever arrived and try again.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt); rebasing onto latest main"
            git pull --rebase origin main
          done
          echo "could not push after 3 attempts"
          exit 1
