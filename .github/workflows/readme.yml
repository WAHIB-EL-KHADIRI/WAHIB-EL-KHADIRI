name: Update README

# README.md is generated from README.tpl.md -- edit the template, not the
# output. This runs daily, and on any push that changes how it renders.
on:
  schedule:
    # 03:17 UTC. Off the hour, because everyone schedules on the hour and
    # GitHub delays crons under load.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.tpl.md
      - scripts/render_readme.py
      - .github/workflows/readme.yml

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render README
        env:
          # README_TOKEN is optional: a classic PAT with read:user also counts
          # private contributions. Without it the default token is used, which
          # sees public activity only.
          GITHUB_TOKEN: ${{ secrets.README_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: python scripts/render_readme.py

      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- README.md; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh README stats"
          git push
