<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Wahib El Khadiri, Junior Full-Stack Developer from Kenitra, Morocco. Open to work. Pull requests merged into Prefect, SQLFluff, the MCP Rust SDK, RustSec and sktime.">
  <title>Wahib El Khadiri — Junior Full-Stack Developer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1512"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a0f12"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ff0c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ea66f" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2ea66f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9434e" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#d9434e" stop-opacity="0"/>
    </radialGradient>

    <!-- Zellige tile: the eight-point star, two squares a quarter turn apart. -->
    <pattern id="zellige" width="80" height="80" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#3ddc97" stroke-opacity="0.09" stroke-width="1.2">
        <rect x="22" y="22" width="36" height="36"/>
        <rect x="22" y="22" width="36" height="36" transform="rotate(45 40 40)"/>
        <path d="M0 40h14.5M65.5 40H80M40 0v14.5M40 65.5V80"/>
      </g>
    </pattern>

    <clipPath id="frame"><rect width="1000" height="340" rx="18"/></clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

    /* Every reveal plays once and holds its final frame, so a paused or
       reduced-motion render still shows the complete banner. */
    .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; }
    .d3 { animation-delay: .55s; } .d4 { animation-delay: .75s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .row { animation: row .45s ease-out both; }
    .r1 { animation-delay: 1.1s; } .r2 { animation-delay: 1.45s; } .r3 { animation-delay: 1.8s; }
    .r4 { animation-delay: 2.15s; } .r5 { animation-delay: 2.5s; } .r6 { animation-delay: 2.95s; }
    @keyframes row { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

    .pulse { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0% { opacity: .75; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.9); } }

    .spin { animation: spin 90s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .row, .pulse, .spin, .cursor { animation: none; }
      .pulse { opacity: 0; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="url(#bg)"/>
    <rect width="1000" height="340" fill="url(#zellige)"/>
    <circle cx="120" cy="40" r="300" fill="url(#glow)"/>
    <circle cx="930" cy="320" r="280" fill="url(#glow2)"/>

    <!-- Large slow star behind the terminal card -->
    <g class="spin" fill="none" stroke="#3ddc97" stroke-opacity="0.16" stroke-width="1.5">
      <rect x="640" y="30" width="280" height="280"/>
      <rect x="640" y="30" width="280" height="280" transform="rotate(45 780 170)"/>
    </g>

    <!-- Identity -->
    <g class="rise d1">
      <text class="mono" x="52" y="74" font-size="17" fill="#3ddc97">Kenitra, Morocco</text>
    </g>
    <g class="rise d2">
      <text class="sans" x="50" y="136" font-size="54" font-weight="800" letter-spacing="-1" fill="url(#name)">Wahib El Khadiri</text>
    </g>
    <g class="rise d3">
      <text class="sans" x="52" y="178" font-size="23" font-weight="600" fill="#e6edf3">Junior Full-Stack Developer</text>
      <text class="sans" x="52" y="208" font-size="18" fill="#9fb0bd">React · Node.js · Laravel · TypeScript</text>
    </g>
    <g class="rise d4">
      <rect x="52" y="240" width="172" height="44" rx="22" fill="#10291f" stroke="#2ea66f" stroke-width="1.4"/>
      <circle class="pulse" cx="77" cy="262" r="6" fill="#3ddc97"/>
      <circle cx="77" cy="262" r="6" fill="#3ddc97"/>
      <text class="sans" x="94" y="268" font-size="17" font-weight="700" fill="#c9f7e1">Open to work</text>
    </g>

    <!-- Merged upstream: the claim, in the shape of a terminal -->
    <g class="rise d2">
      <rect x="548" y="48" width="404" height="244" rx="12" fill="#0a0f14" fill-opacity="0.93" stroke="#2b3640"/>
      <path d="M548 60a12 12 0 0 1 12-12h380a12 12 0 0 1 12 12v22H548z" fill="#161d25"/>
      <circle cx="569" cy="65" r="5.5" fill="#d9434e"/>
      <circle cx="588" cy="65" r="5.5" fill="#e3b341"/>
      <circle cx="607" cy="65" r="5.5" fill="#3ddc97"/>
      <text class="mono" x="750" y="70" font-size="14" fill="#7d8b99" text-anchor="middle">merged by maintainers</text>
    </g>

    <g class="mono" font-size="16.5">
      <g class="rise d3">
        <text x="568" y="112" fill="#3ddc97">$</text>
        <text x="586" y="112" fill="#e6edf3">gh search prs --author=@me --merged</text>
      </g>
      <g class="row r1"><text x="568" y="143" fill="#3ddc97">✓</text><text x="592" y="143" fill="#c9d4dd">PrefectHQ/prefect</text><text x="932" y="143" fill="#7d8b99" text-anchor="end">#22882</text></g>
      <g class="row r2"><text x="568" y="170" fill="#3ddc97">✓</text><text x="592" y="170" fill="#c9d4dd">sqlfluff/sqlfluff</text><text x="932" y="170" fill="#7d8b99" text-anchor="end">#8375</text></g>
      <g class="row r3"><text x="568" y="197" fill="#3ddc97">✓</text><text x="592" y="197" fill="#c9d4dd">modelcontextprotocol/rust-sdk</text><text x="932" y="197" fill="#7d8b99" text-anchor="end">#1281</text></g>
      <g class="row r4"><text x="568" y="224" fill="#3ddc97">✓</text><text x="592" y="224" fill="#c9d4dd">rustsec/rustsec</text><text x="932" y="224" fill="#7d8b99" text-anchor="end">#1714</text></g>
      <g class="row r5"><text x="568" y="251" fill="#3ddc97">✓</text><text x="592" y="251" fill="#c9d4dd">sktime/sktime</text><text x="932" y="251" fill="#7d8b99" text-anchor="end">#10730</text></g>
      <g class="row r6"><text x="568" y="277" fill="#3ddc97">$</text><rect class="cursor" x="586" y="264" width="10" height="17" fill="#3ddc97"/></g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="998.5" height="338.5" rx="17.5" fill="none" stroke="#2b3640" stroke-width="1.5"/>
</svg>
